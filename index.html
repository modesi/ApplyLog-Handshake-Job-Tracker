<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Handshake Job Tracker</title>
    <link rel="stylesheet" href="CSSExtension.css" />
</head>
<body>
 <div class="container">
   <!-- Header -->
   <div class="header">
     <div class="logo">
       <span class="logo-icon">📋</span>
       <h1>Job Tracker</h1>
     </div>
     <div class="status-indicator" id="statusIndicator">
       <span class="status-dot"></span>
       <span class="status-text">Not connected</span>
     </div>
   </div>


   <!-- Connection Section -->
   <div class="section" id="connectionSection">
     <div class="connect-button-container">
       <button id="connectBtn" class="btn-primary">
         🔗 Connect Google Sheets
       </button>
     </div>
     <p class="helper-text" id="helperText">
       Connect your Google Sheets to automatically track jobs you apply to on Handshake.
     </p>
   </div>


   <!-- Tabs -->
   <div class="tabs">
     <button class="tab active" data-tab="applied">Applied</button>
     <button class="tab" data-tab="saved">Saved</button>
   </div>


   <!-- Applied Jobs Section -->
   <div class="tab-content active" id="applied-content">
     <div class="jobs-list" id="appliedJobs">
       <div class="empty-state">
         <p>No applied jobs yet</p>
         <small>When you apply to a job on Handshake, click "Yes" to track it here.</small>
       </div>
     </div>
   </div>


   <!-- Saved Jobs Section -->
   <div class="tab-content" id="saved-content">
     <div class="jobs-list" id="savedJobs">
       <div class="empty-state">
         <p>No saved jobs yet</p>
         <small>Save jobs on Handshake to track them here.</small>
       </div>
     </div>
   </div>


   <!-- Actions -->
   <div class="actions">
     <button id="refreshBtn" class="btn-secondary">🔄 Refresh</button>
     <button id="clearBtn" class="btn-danger">🗑️ Clear All</button>
   </div>


   <!-- Spreadsheet Link -->
   <div class="spreadsheet-link" id="spreadsheetLink" style="display: none;">
     <a href="#" target="_blank" id="openSpreadsheet">
       📊 Open Google Sheets
     </a>
   </div>
 </div>


 <script src="popup.js"></script>
</body>
</html>
