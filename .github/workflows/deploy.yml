name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject Picker API key
        env:
          PICKER_API_KEY: ${{ secrets.PICKER_API_KEY }}
        run: |
          if [ -z "$PICKER_API_KEY" ]; then
            echo "::error::PICKER_API_KEY repository secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p _site
          cp -r ./* _site/ 2>/dev/null || true
          # .github isn't part of the published site
          rm -rf _site/.github
          sed -i "s|__PICKER_API_KEY__|${PICKER_API_KEY}|g" _site/picker.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
